# Wklej te bloki do vhosta domeny orlywro.pro (serwer HTTPS 443 z certbotem).
# Statyka gry ze /home/ubuntu/orlywro-game/game, API i WebSocket do Node na 127.0.0.1:8502.

# --- Gra: statyka ---
location = /game {
    return 301 /game/;
}
location /game/ {
    alias /home/ubuntu/orlywro-game/game/;
    try_files $uri $uri/ /game/index.html;
    index index.html;
}

# --- Gra: API (host/join/rejoin/rankings) ---
location /api/ {
    proxy_pass http://127.0.0.1:8502;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# --- Gra: WebSocket ---
location /ws {
    proxy_pass http://127.0.0.1:8502;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# --- Gra: health-check ---
location = /healthz {
    proxy_pass http://127.0.0.1:8502/healthz;
    proxy_set_header Host $host;
    access_log off;
}
