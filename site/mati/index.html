<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Łap Krowę! 🐄</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, #8fd14f 0%, #4a8f29 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    overflow: hidden;
  }
  header {
    background: rgba(255,255,255,.9);
    width: 100%;
    text-align: center;
    padding: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  h1 { color: #2e7d32; }
  .hud { margin-top: .5rem; font-size: 1.2rem; font-weight: bold; display: flex; gap: 2rem; justify-content: center; }
  #board {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 700px;
  }
  .animal {
    position: absolute;
    font-size: 3rem;
    cursor: pointer;
    transition: transform .05s;
    filter: drop-shadow(2px 3px 3px rgba(0,0,0,.25));
  }
  .animal:active { transform: scale(1.25); }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
    z-index: 10;
  }
  #overlay h2 { font-size: 2.5rem; margin-bottom: 1rem; }
  #overlay button {
    font-size: 1.3rem;
    padding: 1rem 2.5rem;
    border: none;
    border-radius: 50px;
    background: #2e7d32;
    color: #fff;
    cursor: pointer;
    margin-top: 1rem;
  }
  #overlay button:hover { background: #1b5e20; transform: scale(1.05); }
  .hidden { display: none !important; }
  .popup {
    position: fixed;
    font-size: 1.5rem;
    font-weight: bold;
    color: #fff;
    text-shadow: 1px 1px 3px #000;
    pointer-events: none;
    animation: rise .8s ease-out forwards;
    z-index: 5;
  }
  @keyframes rise {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-60px); }
  }
</style>
</head>
<body>

<header>
  <h1>🎮 Łap Krowę!</h1>
  <div class="hud">
    <span>Wynik: <span id="score">0</span></span>
    <span>⏱ <span id="time">30</span>s</span>
    <span>Rekord: <span id="best">0</span></span>
  </div>
</header>

<div id="board"></div>

<div id="overlay">
  <h2>🐄 Łap Krowę!</h2>
  <p>Klikaj krowy 🐄 (+10 pkt) i mleko 🥛 (+1s czasu).<br>Unikaj wilka 🐺 (-20 pkt i traci rower!).</p>
  <div style="font-size:3rem">↓</div>
  <button id="startBtn">Start!</button>
</div>

<script>
  const board = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const timeEl = document.getElementById("time");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");

  let score = 0, time = 30, playing = false;
  let best = +(localStorage.getItem("cowBest") || 0);
  bestEl.textContent = best;

  const types = {
    cow:    { emoji: "🐄", life: 1400, points: 10 },
    milk:   { emoji: "🥛", life: 1100, points: 5, timeBonus: 1 },
    wolf:   { emoji: "🐺", life: 1600, points: -20 }
  };

  function spawn() {
    const keys = ["cow", "cow", "cow", "milk", "wolf"];
    const type = keys[Math.floor(Math.random() * keys.length)];
    const t = types[type];

    const el = document.createElement("div");
    el.className = "animal";
    el.textContent = t.emoji;
    el.style.left = Math.random() * 85 + 2 + "%";
    el.style.top = Math.random() * 80 + 5 + "%";
    board.appendChild(el);

    const timer = setTimeout(() => el.remove(), t.life);

    el.addEventListener("click", () => {
      if (!playing) return;
      clearTimeout(timer);
      el.remove();
      score = Math.max(0, score + t.points);
      scoreEl.textContent = score;
      if (t.timeBonus) time = Math.min(60, time + t.timeBonus);
      popup(el.style.left, el.style.top, (t.points > 0 ? "+" : "") + t.points);
      if (t.points < 0) navigator.vibrate && navigator.vibrate(100);
    });
  }

  function popup(left, top, text) {
    const p = document.createElement("div");
    p.className = "popup";
    p.textContent = text;
    p.style.left = left;
    p.style.top = top;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }

  let spawnLoop, timeLoop;

  function start() {
    score = 0; time = 30; playing = true;
    scoreEl.textContent = 0;
    overlay.classList.add("hidden");
    board.innerHTML = "";

    timeLoop = setInterval(() => {
      time--;
      timeEl.textContent = time;
      if (time <= 0) end();
    }, 1000);

    spawnLoop = setInterval(() => {
      spawn();
      if (score > 50) spawn(); // trudniej!
    }, 800);
  }

  function end() {
    playing = false;
    clearInterval(spawnLoop);
    clearInterval(timeLoop);
    board.innerHTML = "";
    overlay.classList.remove("hidden");
    if (score > best) {
      best = score;
      localStorage.setItem("cowBest", best);
      bestEl.textContent = best;
      overlay.querySelector("p").textContent = "🏆 NOWY REKORD! Wynik: " + score;
    } else {
      overlay.querySelector("p").textContent = "Wynik: " + score + " (rekord: " + best + ")";
    }
  }

  document.getElementById("startBtn").addEventListener("click", start);
</script>

</body>
</html>
